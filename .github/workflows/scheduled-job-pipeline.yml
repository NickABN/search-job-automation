name: Scheduled job pipeline

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Digest slot to run
        required: true
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: read

concurrency:
  group: scheduled-job-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application
        run: python -m pip install --disable-pip-version-check -e .

      - name: Resolve digest slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$DISPATCH_SLOT" in
              morning|evening) slot="$DISPATCH_SLOT" ;;
              *) echo "Unsupported manual slot" >&2; exit 1 ;;
            esac
          else
            case "$SCHEDULE" in
              "0 15 * * *") slot=morning ;;
              "0 0 * * *") slot=evening ;;
              *) echo "Unsupported schedule event" >&2; exit 1 ;;
            esac
          fi
          printf 'DIGEST_SLOT=%s\n' "$slot" >> "$GITHUB_ENV"
          echo "Resolved digest slot: $slot"

      - name: Wait for Neon PostgreSQL readiness
        run: wait-for-database --attempts 6 --attempt-timeout 5 --delay 2

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Ingest Bitso Greenhouse jobs
        run: greenhouse-ingest --board-token bitso --company Bitso

      - name: Rank top jobs
        run: rank-jobs --limit 20

      - name: Send resolved digest
        run: send-job-digest --slot "$DIGEST_SLOT"
